# Bounded JVM sizing: the previous -Xmx8G/-XX:MaxMetaspaceSize=4G daemon
# saturated a 12 GB build host when two builds overlapped. One build at a
# time, capped, is fast enough for this app.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
